name: CI

on:
  push:
    branches: [main, refactor/architecture-campaign]
    tags: ['v*']
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # PRs receive this check in the strict gate; direct campaign publication
  # and merge queues also need an explicit immutable lockfile baseline.
  quarantine:
    name: Cargo release-age quarantine (push and merge queue)
    if: (github.event_name == 'push' && github.ref_type == 'branch' && !github.event.deleted) || github.event_name == 'merge_group'
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","Linux","X64","local-ci"]') || 'ubuntu-24.04' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: codeandsolder/ci-workflows/.github/actions/cargo-release-quarantine@83ceff49d93d152cd95a1c9d6addb5cf03169477 # main
        with:
          base-ref: ${{ github.event.merge_group.base_sha || (github.event.before != '0000000000000000000000000000000000000000' && github.event.before) || 'origin/main' }}
          lockfile: auto
          hours: "72"

  strict-rust:
    name: Strict Rust
    uses: codeandsolder/rust-skills2/.github/workflows/strict-rust.yml@7d0552029497cf094787c3593f804d5bce137c4b # main
    with:
      allow-test-panics: true

  nightly:
    name: Source archive, locked tests and C reference
    uses: codeandsolder/ci-workflows/.github/workflows/rust-sccache.yml@83ceff49d93d152cd95a1c9d6addb5cf03169477 # main
    with:
      test-impact-mode: none
      command: bash .github/scripts/verify-source.sh
