name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_WARNINGS: deny

jobs:
  strict-rust:
    name: Strict Rust
    uses: codeandsolder/rust-skills2/.github/workflows/strict-rust.yml@7d0552029497cf094787c3593f804d5bce137c4b # main
    with:
      allow-test-panics: true
      rust-toolchain: nightly-2026-11-20

  nightly:
    name: Nightly Rust
    runs-on: [self-hosted, Linux, X64, local-ci]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install pinned translator reference simulator
        id: simulator
        run: |
          set -euo pipefail
          directory="$(mktemp -d "$RUNNER_TEMP/ngspice-reference.XXXXXXXX")"
          printf 'directory=%s\n' "$directory" >> "$GITHUB_OUTPUT"
          bash .github/scripts/install-reference-ngspice.sh "$directory/reference"
          printf '%s\n' "$directory/reference/bin" >> "$GITHUB_PATH"
      - name: Install repository toolchain
        run: rustup toolchain install
      - name: Toolchain versions
        run: |
          rustc --version
          cargo --version
      - name: Setup mandatory sccache
        uses: codeandsolder/ci-workflows/.github/actions/setup-sccache@d168449633a47de6c0166f0c0cff903e96983820 # main
        with:
          rust-toolchain: "nightly-2026-11-20"
      - name: Lockfile consistency
        run: cargo metadata --locked --format-version 1 >/dev/null
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check all targets
        run: cargo check --locked --workspace --all-targets
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --locked --workspace --all-targets
      - name: Documentation
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --locked --workspace --no-deps
      - name: Remove reference simulator
        if: always() && steps.simulator.outputs.directory != ''
        env:
          SIMULATOR_DIRECTORY: ${{ steps.simulator.outputs.directory }}
        run: rm -rf -- "$SIMULATOR_DIRECTORY"
      - name: Finalize mandatory sccache
        if: always()
        uses: codeandsolder/ci-workflows/.github/actions/finalize-sccache@d168449633a47de6c0166f0c0cff903e96983820 # main
