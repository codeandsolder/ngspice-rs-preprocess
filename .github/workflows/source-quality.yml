name: Source quality

on:
  pull_request:
  merge_group:
  push:
    branches: [main, refactor/architecture-campaign]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  source-quality:
    uses: codeandsolder/ci-workflows/.github/workflows/source-quality.yml@c91a4c750313d013131dd9b5cda15d1523cf81b6 # main
