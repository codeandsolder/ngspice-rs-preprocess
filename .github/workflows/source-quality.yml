name: Source quality

on:
  pull_request:
  merge_group:
  push:
    branches: [main, refactor/architecture-campaign]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  source-quality:
    uses: codeandsolder/ci-workflows/.github/workflows/source-quality.yml@97a50dd3304be8cf19738aa1c027ac4ecd1f3d2b # main
