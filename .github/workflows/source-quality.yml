name: Source quality

on:
  pull_request:
  merge_group:
  push:
    branches: [main, refactor/architecture-campaign]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  source-quality:
    uses: codeandsolder/ci-workflows/.github/workflows/source-quality.yml@1ef8b180d04fbeb8c095e8d701f8a5107472370e # main
