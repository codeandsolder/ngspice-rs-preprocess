name: Source quality

on:
  pull_request:
  merge_group:
  push:
    branches: [main, refactor/architecture-campaign]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  source-quality:
    uses: codeandsolder/ci-workflows/.github/workflows/source-quality.yml@f22d2e61394d5b0b79314d24d16523eed509d496 # main
