name: Source quality

on:
  pull_request:
  merge_group:
  push:
    branches: [main, refactor/architecture-campaign]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  source-quality:
    uses: codeandsolder/ci-workflows/.github/workflows/source-quality.yml@5b72e3865937d6e85e9ea485af9d04ec83343c5f # main
