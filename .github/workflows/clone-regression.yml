name: Duplicate-code regression

on:
  pull_request:
  push:
    branches: [main, refactor/architecture-campaign]
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  duplicates:
    uses: codeandsolder/ci-workflows/.github/workflows/clone-regression.yml@f22d2e61394d5b0b79314d24d16523eed509d496 # main
