[package]
name = "ngspice-rs-preprocess"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Unified SPICE source preparation interface"

[lints]
workspace = true

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
model-preprocess-command = { path = "../model-preprocess-command" }
model-normalize-ngspice = { path = "../model-normalize-ngspice" }
model-preprocess-simplis = { path = "../model-preprocess-simplis" }
model-translate-simplis = { path = "../model-translate-simplis" }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1", features = ["fs"] }
