[workspace]
members = [
    "crates/model-alb-xspice-ffi",
    "crates/model-alb-experimental",
    "crates/model-kernel-api",
    "crates/model-prepare-osdi",
    "crates/model-statistics",
    "crates/model-kernel-diode",
    "crates/model-kernel-bipolar",
    "crates/model-kernel-bsim",
    "crates/model-compact-intrinsic",
    "crates/model-kernel-vdmos",
    "crates/model-normalize-ngspice",
    "crates/model-preprocess-simplis",
    "crates/model-preprocess-command",
    "crates/model-translate-simplis",
    "crates/model-touchstone",
    "crates/ngspice-rs-preprocess",
]
default-members = [
    "crates/model-kernel-api",
    "crates/model-prepare-osdi",
    "crates/model-statistics",
    "crates/model-kernel-diode",
    "crates/model-kernel-bipolar",
    "crates/model-kernel-bsim",
    "crates/model-compact-intrinsic",
    "crates/model-kernel-vdmos",
    "crates/model-normalize-ngspice",
    "crates/model-preprocess-simplis",
    "crates/model-preprocess-command",
    "crates/model-translate-simplis",
    "crates/model-touchstone",
    "crates/ngspice-rs-preprocess",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/codeandsolder/ngspice-rs-preprocess"
publish = false

[workspace.dependencies]
model-alb-experimental = { path = "crates/model-alb-experimental", version = "=0.1.0" }
model-compact-intrinsic = { path = "crates/model-compact-intrinsic", version = "=0.1.0" }
model-kernel-api = { path = "crates/model-kernel-api", version = "=0.1.0" }
model-kernel-bipolar = { path = "crates/model-kernel-bipolar", version = "=0.1.0" }
model-kernel-bsim = { path = "crates/model-kernel-bsim", version = "=0.1.0" }
model-kernel-diode = { path = "crates/model-kernel-diode", version = "=0.1.0" }
model-kernel-vdmos = { path = "crates/model-kernel-vdmos", version = "=0.1.0" }
model-normalize-ngspice = { path = "crates/model-normalize-ngspice", version = "=0.1.0" }
model-prepare-osdi = { path = "crates/model-prepare-osdi", version = "=0.1.0" }
model-preprocess-command = { path = "crates/model-preprocess-command", version = "=0.1.0" }
model-preprocess-simplis = { path = "crates/model-preprocess-simplis", version = "=0.1.0" }
model-statistics = { path = "crates/model-statistics", version = "=0.1.0" }
model-touchstone = { path = "crates/model-touchstone", version = "=0.1.0" }
model-translate-simplis = { path = "crates/model-translate-simplis", version = "=0.1.0" }

[workspace.lints.rust]
warnings = { level = "deny", priority = -1 }
unfulfilled_lint_expectations = "deny"
unexpected_cfgs = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
style = { level = "deny", priority = -1 }
complexity = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }

unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"
await_holding_lock = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"

